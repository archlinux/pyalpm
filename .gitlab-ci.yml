image: "archlinux:latest"

before_script:
    - >
      pacman -Syu --needed --noconfirm
      make base-devel python meson-python meson
      python-pytest python-pytest-cov python-pytest-pacman
      python-sphinx ruff twine gcovr


stages:
  - lint
  - test
  - doc


lint:
  script:
    - ruff check pycman
  except:
    - schedules


test:
  script:
    - meson setup build -Db_coverage=true
    - meson compile -C build
    - meson test -C build
  artifacts:
    reports:
      junit: build/report.xml
  except:
    - schedules

next:
  only:
    - schedules
  script:
    - pacman -Syu --needed --noconfirm meson git
    - git clone https://gitlab.archlinux.org/pacman/pacman.git
    - cd pacman && mkdir build && cd build && meson .. && ninja
    - cd $CI_PROJECT_DIR && PKG_CONFIG_PATH=./pacman/build/meson-uninstalled make build

pypi:
  only:
    - tags
    - secure
  script:
    - meson -C build dist
    - twine upload build/meson-dist/*

include:
- template: Security/SAST.gitlab-ci.yml

sast:
  before_script:
    - ''
